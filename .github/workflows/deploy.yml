name: Deploy to GitHub Pages

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch gh-pages branch
      run: git fetch origin gh-pages --depth=1 || true

    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.9.1
      with:
        ssh-private-key: |
          ${{ secrets.SSH_FIRMWARE_DEPLOY_PRIVATE_KEY }}
          ${{ secrets.SSH_MOBILE_DEPLOY_PRIVATE_KEY }}

    - name: Checkout firmware and mobile docs
      run: |
        cd ..
        git clone ssh://git@github.com/przemczan/lightnet-firmware.git
        git clone ssh://git@github.com/przemczan/lightnet-mobile.git

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Build
      run: mkdocs build

    - name: Determine mike version
      id: version
      if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION="${GITHUB_REF_NAME#v}"
        else
          VERSION="current"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Configure git identity for mike
      if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Deploy with mike
      if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
      run: mike deploy --push --update-aliases "${{ steps.version.outputs.version }}" latest

    - name: Set default version
      if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
      run: mike set-default --push latest
